# Every top-level directory is a stow package and gets linked into ~.
# Adding a new tool = adding its directory. Nothing to do here unless
# it is an exception.
#
#   target  <pkg>   <dir>  [macos|linux]   link <pkg> into <dir> instead of ~
#                                          (with an OS: package exists only there)
#   bundle  <name>  <pkg|bundle>...        group of packages for `just stow-bundle`
#
# Placeholders:
#   {config}  ~/Library/Application Support on macOS, ~/.config on Linux
#   {shell}   zsh on macOS, bash on Linux
#   ~         your home directory

target  lazygit  {config}/lazygit
target  vscode   {config}
target  ghostty  {config}/com.mitchellh.ghostty  macos

bundle  base    {shell} starship rex git jj nvim
bundle  extras  lazygit yazi zellij scripts
bundle  all     base extras
