"$schema" = 'https://starship.rs/config-schema.json'
palette = "kanso"
command_timeout = 1500
add_newline = false

format = """
$character\
$directory\
$nix_shell\
${custom.jj}\
${custom.git}\
$python\
$rust\
$golang"""

[character]
success_symbol = "[➜](bold success)"
error_symbol = "[➜](bold error)"

[directory]
truncation_length = 1
truncate_to_repo = false
read_only = " 🔒"
style = "directory"
format = "[$path]($style)[$read_only]($read_only_style) "

[nix_shell]
format = '[nix:\($state\)]($style) '
style = "nix_symbol"
pure_msg = "pure"
impure_msg = "impure"

# jj-starship emits its own colours; $output is passed through verbatim.
[custom.jj]
description = "Jujutsu change id, bookmark and status"
when = "jj root"
command = "jj-starship prompt --no-jj-prefix"
symbol = "󱗆 "
format = "[$symbol](jj_symbol)$output "

[custom.git]
description = "Git branch and status (only when not a jj repo)"
when = "! jj root > /dev/null 2>&1 && git rev-parse --is-inside-work-tree"
command = "jj-starship prompt --no-git-prefix --no-git-id"
symbol = " "
format = "[$symbol](branch)$output "

# Built-in git modules are replaced by the custom.git module above.
[git_branch]
disabled = true

[git_status]
disabled = true

[python]
format = "[ $virtualenv ]($style)"
style = "python"

[rust]
symbol = " "
format = "[$symbol]($style)"
style = "rust"

[golang]
symbol = " "
format = "[$symbol]($style)"
style = "go"

